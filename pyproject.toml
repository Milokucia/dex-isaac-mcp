[build-system]
requires = ["setuptools>=77"]  # SPDX `license = "MIT"`
build-backend = "setuptools.build_meta"

[project]
name = "dex-isaac-mcp"
version = "0.1.1"
description = "MCP server that drives a live, persistent Isaac Sim session and Isaac Lab training runs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "isaac-sim", "isaac-lab", "omniverse", "robotics",
            "reinforcement-learning", "claude", "simulation", "physx"]
authors = [{name = "Milo Kucia"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Host side only. The daemon runs inside Isaac Lab's own python (see docker/).
dependencies = ["mcp>=2.3"]

[project.urls]
Homepage = "https://github.com/Milokucia/dex-isaac-mcp"
Issues = "https://github.com/Milokucia/dex-isaac-mcp/issues"

[project.optional-dependencies]
metrics = ["tensorboard"]

[project.scripts]
dex-isaac-mcp = "dex_isaac_mcp.mcp_server:main"

[tool.setuptools]
packages = ["dex_isaac_mcp", "dex_isaac_mcp.daemon"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
